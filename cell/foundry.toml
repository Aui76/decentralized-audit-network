# Audit Cell — settlement core (self-contained Foundry project)

[profile.default]
src = "contracts"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.20"
optimizer = true
optimizer_runs = 1
via_ir = true
remappings = [
  "forge-std/=lib/forge-std/src/",
  "genesis-tools/=contracts/tools/",
  "demo-lp/=../tools/lp-demo-pool/contracts/",
]

fs_permissions = [
  { access = "read-write", path = "./deployments" },
  { access = "read", path = "../tools/lp-demo-pool" },
]

# The profile for re-deriving a pinned tool artifact (the zero-slot recipe in NOTICE).
# solc writes the remapping list into the metadata it hashes into the bytecode, so the
# recipe has to see the remappings TransferCreditsV1 was built with on 2026-06-30: these
# two, and nothing auto-detected. Build only the tool file under it, because the rest of
# the tree needs the demo-lp remapping:
#   FOUNDRY_PROFILE=artifact forge build contracts/tools/TransferCreditsV1.sol
[profile.artifact]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "genesis-tools/=contracts/tools/",
]
auto_detect_remappings = false
# Its own build folders, because Foundry does not rebuild when only the profile changes,
# so a shared out/ would hand one profile the other's bytecode (measured 2026-09-26).
out = "out/artifact"
cache_path = "cache/artifact"

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

# Etherscan API v2 — pass key on CLI for Basescan verify:
#   forge verify-contract ... --chain base-sepolia --etherscan-api-key $env:ETHERSCAN_API_KEY
# Sourcify (no key): rename .env aside, then --verifier sourcify --chain-id 84532
etherscan_api_version = "v2"

# Intentionally no [etherscan] block — avoids requiring ETHERSCAN_API_KEY for every forge command.
# Basescan verify still works via --etherscan-api-key (reads from .env in your shell).
